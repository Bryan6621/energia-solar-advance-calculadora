<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Calculadora Solar Advance</title>
  <meta name="description" content="Las fórmulas del capítulo 31 de «Energía Solar Advance», verificadas contra el libro, con la operación a la vista y gráficas en vivo. Funciona sin conexión.">
  <meta name="theme-color" content="#0F2B48">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./iconos/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./iconos/favicon-32.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Solar Advance">
  <link rel="preload" href="./fuentes/source-serif-4-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./fuentes/inter-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <header class="cabecera">
    <a class="cabecera__marca" href="#/" aria-label="Inicio de la Calculadora Solar Advance">
      <img class="cabecera__logo" src="./logo_advance.png" alt="">
      <span class="cabecera__textos"><span class="cabecera__titulo"><span class="cabecera__largo">Calculadora </span>Solar Advance</span><span class="cabecera__subtitulo">Fórmulas del libro, verificadas</span></span>
    </a>
    <div class="cabecera__acciones">
      <label class="tasa" id="moneda-tasa-etiqueta" hidden><span>por US$</span>
        <input id="moneda-tasa" type="number" step="any" inputmode="decimal" aria-label="Tasa de cambio orientativa: unidades de moneda local por dólar" title="Tasa orientativa: edítela con la del día">
      </label>
      <div class="moneda" id="moneda-selector">
        <button class="moneda__boton" id="moneda-select" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Moneda">
          <span class="moneda__bandera" id="moneda-bandera"></span><span id="moneda-texto">USD</span>
          <svg class="moneda__flecha" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <div class="moneda__lista" id="moneda-lista" role="listbox" aria-label="Moneda y país"></div>
      </div>
      <button class="boton-icono" id="boton-tema" type="button" aria-pressed="false" aria-label="Modo oscuro" title="Modo claro u oscuro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <nav class="tabbar" id="tabbar" aria-label="Módulos de fórmulas" hidden></nav>
  <main class="contenido" id="contenido"></main>

  <aside class="hoja" id="hoja-instalar" aria-labelledby="instalar-titulo">
    <p class="hoja__titulo" id="instalar-titulo">Llévela en el teléfono</p>
    <p class="hoja__texto" id="instalar-texto"></p>
    <div class="hoja__acciones">
      <button class="boton boton--secundario" id="boton-ahora-no" type="button">Ahora no</button>
      <button class="boton" id="boton-instalar" type="button">Instalar</button>
    </div>
  </aside>

  <div class="superposicion" id="modal-proyecto" role="dialog" aria-modal="true" aria-labelledby="proyecto-titulo">
    <div class="panel">
      <p class="panel__titulo" id="proyecto-titulo">Guardar proyecto</p>
      <p class="panel__texto">Guarda todos los valores de las fórmulas en este dispositivo, sin cuenta y sin nube.</p>
      <input class="texto" id="proyecto-nombre" type="text" placeholder="Por ejemplo: Familia Gómez, Envigado" autocomplete="off" aria-label="Nombre del proyecto">
      <div class="hoja__acciones">
        <button class="boton boton--secundario" id="proyecto-cancelar" type="button">Cancelar</button>
        <button class="boton" id="proyecto-confirmar" type="button">Guardar</button>
      </div>
    </div>
  </div>

  <noscript><p style="padding:16px">La calculadora necesita JavaScript activado.</p></noscript>
  <script src="./js/motor.js"></script>
  <script src="./js/formulas.js"></script>
  <script src="./js/graficos.js"></script>
  <script src="./js/herramientas-pro.js"></script>
  <script src="./js/localizacion.js"></script>
  <script src="./js/banderas.js"></script>
  <script src="./js/almacen.js"></script>
  <script src="./js/venta.js"></script>
  <script src="./js/qr.js"></script>
  <script src="./js/examen.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
